<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bomb Arena" />
    <title>Bomb Arena</title>
    <meta name="description" content="Jogo de arena com bombas para jogar no navegador, sozinho contra o computador ou com amigos." />
    <meta name="theme-color" content="#1b1f3b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #3a4fd0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Ocupa só a parte realmente visível (no Safari do iPhone, 100vh passa por baixo da barra do navegador) e respeita o entalhe. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        touch-action: none;
      }
      #game canvas {
        touch-action: none;
      }
      /* Celular em pé: pede para deitar (o jogo é de tela larga). */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #1b1f3b;
        color: #fff;
        font: 700 22px/1.3 system-ui, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #rotate span {
        font-size: 64px;
      }
      #rotate small {
        font-weight: 400;
        font-size: 15px;
        opacity: 0.8;
        max-width: 320px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <span>&#x21BB;</span>
      Gire o celular para o modo deitado
      <small>No iPhone, para jogar em tela cheia: toque em Compartilhar e em &ldquo;Adicionar &agrave; Tela de In&iacute;cio&rdquo;, e abra o jogo pelo &iacute;cone.</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
